name: "CodeQL"

on:
  pull_request_target:
  schedule:
    - cron: '14 10 * * 1'

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # pull_request_target runs with secrets, so only build PR code from branches in this repo (never forks)
    if: ${{ (github.actor == 'dependabot[bot]' || github.actor == 'bigboxer23') && (github.event_name != 'pull_request_target' || github.event.pull_request.head.repo.full_name == github.repository) }}
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java' ]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          # github.ref is the base branch for pull_request_target; build the PR's head instead
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      # Initializes the CodeQL tools for scanning.
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - name: Set up JDK 11
        uses: actions/setup-java@v5
        with:
          java-version: 11.0
          distribution: 'adopt'
      -   name: maven-settings
          uses: s4u/maven-settings-action@v3.0.0
          with:
            servers: '[{"id": "github", "username": "dummy", "password": "${GITHUB_TOKEN_REF}"}]'
            githubServer: false
      -   name: Run Tests with Maven
          # stop at test: package would read application.properties and scp to the pi
          run: mvn clean test -f "pom.xml" -B -V -e -Dfindbugs.skip -Dcheckstyle.skip -Dpmd.skip=true -Dspotbugs.skip -Denforcer.skip -Dmaven.javadoc.skip -Dlicense.skip=true -Drat.skip=true -Dspotless.check.skip=true -Dspotless.apply.skip=true
          env:
            GITHUB_TOKEN_REF: ${{ secrets.GH_PAT_FOR_ACTIONS_TOKEN }}

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{matrix.language}}"
